<header class="navbar-wrapper">
    <nav class="navbar-container">
        <!-- Brand / Logo -->
        <a routerLink="/" (click)="closeMenu()" class="brand-logo">
            <span class="brand-badge">CIS</span>
            <span class="brand-text">SIMRACING HUB</span>
        </a>

        <!-- Hamburger Menu Toggle (Mobile) -->
        <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-label="Apri menu">
            <span class="bar" [class.open]="isMenuOpen"></span>
            <span class="bar" [class.open]="isMenuOpen"></span>
            <span class="bar" [class.open]="isMenuOpen"></span>
        </button>

        <!-- Nav Links -->
        <div class="nav-menu" [class.active]="isMenuOpen">
            <ul class="nav-list">
                <li>
                    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                        (click)="closeMenu()">Home</a>
                </li>
                <li>
                    <a routerLink="/races" routerLinkActive="active" (click)="closeMenu()">Campionati & Gare</a>
                </li>
                <li>
                    <a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Risultati & Foto</a>
                </li>
                <li>
                    <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Chi Siamo</a>
                </li>
                <li>
                    <a routerLink="/faq" routerLinkActive="active" (click)="closeMenu()">FAQ & Regolamento</a>
                </li>
            </ul>

            <!-- CTA Admin Area -->
            <div class="nav-actions">
                <a routerLink="/admin" routerLinkActive="active" class="btn-admin" (click)="closeMenu()">
                    Area Staff
                </a>
            </div>
        </div>
    </nav>
</header>
